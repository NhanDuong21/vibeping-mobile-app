[package]
name = "vibeping"
version = "1.0.0-rc.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
anyhow = "=1.0.104"
async-stream = "=0.3.6"
axum = { version = "=0.8.9", features = ["http1", "json", "tokio"] }
chrono = { version = "=0.4.45", features = ["clock", "serde"] }
clap = { version = "=4.6.6", features = ["derive"] }
futures-core = "=0.3.34"
fs2 = "=0.4.3"
mime_guess = "=2.0.5"
rust-embed = { version = "=8.12.0", features = ["debug-embed", "interpolate-folder-path"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", default-features = false, features = ["chrono", "macros", "migrate", "runtime-tokio", "sqlite"] }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "=0.7.1", features = ["catch-panic", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
utoipa = { version = "=5.5.0", features = ["axum_extras", "chrono"] }
uuid = { version = "=1.26.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"
