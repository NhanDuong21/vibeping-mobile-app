@if (visible()) {
  <nav
    class="fixed inset-x-0 bottom-0 z-40 border-t border-vibe-rule bg-vibe-surface pb-[env(safe-area-inset-bottom)] dark:border-vibe-rule-dark dark:bg-vibe-night"
    aria-label="Điều hướng chính"
  >
    <div class="relative isolate mx-auto grid h-[3.75rem] w-full max-w-lg grid-cols-3 px-4">
      <span
        class="pointer-events-none absolute inset-y-1 left-4 -z-10 w-[calc((100%-2rem)/3)] transition-transform duration-300 ease-[cubic-bezier(0.22,1.2,0.36,1)]"
        [style.transform]="'translateX(' + position() * 100 + '%)'"
        aria-hidden="true"
        data-testid="navigation-pill"
      >
        <span
          class="mx-auto block h-7 w-12 rounded-full bg-vibe-mint-soft dark:bg-vibe-mint/20"
        ></span>
      </span>
      <a
        #activityActive="routerLinkActive"
        routerLink="/activity"
        routerLinkActive="text-vibe-green! dark:text-vibe-mint!"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: false }"
        class="relative grid min-h-11 place-items-center content-center gap-0.5 text-[0.75rem] font-bold text-vibe-muted! transition-opacity active:opacity-60 dark:text-vibe-sage!"
      >
        <span
          class="relative grid h-7 w-10 place-items-center rounded-full transition-colors duration-200 motion-reduce:transition-none"
          [class]="activityActive.isActive ? 'text-vibe-green! dark:text-vibe-mint!' : ''"
        >
          <svg
            appSignalMotion="ping"
            [motionKey]="activityActive.isActive"
            class="size-[1.375rem]"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M4 18V9m5 9V5m5 13v-7m5 7V3" />
          </svg>
          @if (activity.unreadCount() > 0) {
            <span
              class="absolute -right-2 -top-1 min-w-4 rounded-full bg-vibe-coral px-1 text-center text-[0.625rem] leading-4 text-white"
              aria-label="Hoạt động chưa đọc"
              appSignalMotion="ping"
              [motionKey]="activity.unreadCount()"
            >
              {{ activity.unreadCount() > 99 ? '99+' : activity.unreadCount() }}
            </span>
          }
        </span>
        <span [class]="activityActive.isActive ? 'text-vibe-green! dark:text-vibe-mint!' : ''"
          >Hoạt động</span
        >
      </a>
      <a
        #computerActive="routerLinkActive"
        routerLink="/computer"
        routerLinkActive="text-vibe-green! dark:text-vibe-mint!"
        ariaCurrentWhenActive="page"
        class="grid min-h-11 place-items-center content-center gap-0.5 text-[0.75rem] font-bold text-vibe-muted! transition-opacity active:opacity-60 dark:text-vibe-sage!"
      >
        <span
          class="grid h-7 w-10 place-items-center rounded-full transition-colors duration-200 motion-reduce:transition-none"
          [class]="computerActive.isActive ? 'text-vibe-green! dark:text-vibe-mint!' : ''"
        >
          <svg
            appSignalMotion="ping"
            [motionKey]="computerActive.isActive"
            class="size-[1.375rem]"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="4" width="18" height="13" rx="2" />
            <path d="M8 21h8m-4-4v4" />
          </svg>
        </span>
        <span [class]="computerActive.isActive ? 'text-vibe-green! dark:text-vibe-mint!' : ''"
          >Máy tính</span
        >
      </a>
      <a
        #settingsActive="routerLinkActive"
        routerLink="/settings"
        routerLinkActive="text-vibe-green! dark:text-vibe-mint!"
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: false }"
        class="grid min-h-11 place-items-center content-center gap-0.5 text-[0.75rem] font-bold text-vibe-muted! transition-opacity active:opacity-60 dark:text-vibe-sage!"
      >
        <span
          class="grid h-7 w-10 place-items-center rounded-full transition-colors duration-200 motion-reduce:transition-none"
          [class]="settingsActive.isActive ? 'text-vibe-green! dark:text-vibe-mint!' : ''"
        >
          <svg
            appSignalMotion="ping"
            [motionKey]="settingsActive.isActive"
            class="size-[1.375rem]"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 8.96 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15 1.7 1.7 0 0 0 3 14H3v-4h.08A1.7 1.7 0 0 0 4.6 8.96a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3h4v.08A1.7 1.7 0 0 0 15.04 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.12.37.35.7.66.92.28.2.6.29.94.29v4c-.34 0-.66.1-.94.29-.31.22-.54.54-.66.91Z"
            />
          </svg>
        </span>
        <span [class]="settingsActive.isActive ? 'text-vibe-green! dark:text-vibe-mint!' : ''"
          >Cài đặt</span
        >
      </a>
    </div>
  </nav>
}
