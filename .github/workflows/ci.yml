name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm exec playwright install chromium
      - name: Generate API contract
        run: pnpm run generate:contracts
      - name: Angular and PWA quality gates
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run test:mobile
          pnpm run build:mobile
          pnpm run check:contracts
      - name: Preserve Gate 0 regression checks
        run: |
          pnpm run build:gate0
          pnpm run check:js
          pnpm run check:pwa
          pnpm run test:gate0
      - name: Rust quality gates
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo build --workspace --release
      - name: Browser end-to-end checks
        run: pnpm run e2e
      - name: Architecture and repository hygiene
        shell: pwsh
        run: |
          .\scripts\check-architecture.ps1
          .\scripts\check-hygiene.ps1
