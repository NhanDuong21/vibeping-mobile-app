[package]
name = "vibeping-gate1"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Gate 1: signed-in Codex rate-limit reader"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3.20"
